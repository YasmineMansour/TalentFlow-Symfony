vich_uploader:
    db_driver: orm

    mappings:
        entreprise_logo:
            uri_prefix: /uploads/logos
            upload_destination: '%kernel.project_dir%/public/uploads/logos'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        candidature_piece_jointe:
            uri_prefix: /uploads/pieces_jointes
            upload_destination: '%kernel.project_dir%/public/uploads/pieces_jointes'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
