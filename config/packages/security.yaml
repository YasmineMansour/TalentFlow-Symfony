security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
                csrf_token_id: authenticate
                csrf_parameter: _csrf_token
                username_parameter: _username
                password_parameter: _password
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                remember_me_parameter: _remember_me
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
            logout:
                path: app_logout
                target: app_login

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            switch_user:
                role: ROLE_ADMIN
                parameter: _switch_user

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/switch-locale, roles: PUBLIC_ACCESS }
        - { path: ^/offres, roles: PUBLIC_ACCESS }
        - { path: ^/forum$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/css/, roles: PUBLIC_ACCESS }
        - { path: ^/js/, roles: PUBLIC_ACCESS }
        - { path: ^/chatbot, roles: PUBLIC_ACCESS }
        - { path: ^/api/currency, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/call, roles: ROLE_USER }
        - { path: ^/message, roles: ROLE_USER }
        - { path: ^/user, roles: ROLE_ADMIN }
        - { path: ^/avatar, roles: PUBLIC_ACCESS }
        - { path: ^/magic-link, roles: PUBLIC_ACCESS }
        - { path: ^/mon-entretien, roles: ROLE_USER }

    role_hierarchy:
        ROLE_RH: ROLE_USER
        ROLE_ADMIN: [ROLE_RH, ROLE_CANDIDAT, ROLE_USER]

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
